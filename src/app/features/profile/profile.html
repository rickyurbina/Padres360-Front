<div class="dashboard-container">


  <!-- Loading State -->
  <div *ngIf="isLoading" class="state-container loading-state">
    <div class="spinner"></div>
    <p>Cargando información del perfil...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="hasError && !isLoading" class="card">
    <div class="state-container error-state">
      <div class="error-icon">
        <img src="/img/error.svg" alt="Error" />
      </div>
      <h3>Error al cargar el perfil</h3>
      <p>{{ errorMessage }}</p>
      <a (click)="retryLoad()" class="link-retry" href="javascript:void(0)">
        Reintentar
      </a>
    </div>
  </div>

  <!-- Profile Content -->
  <div *ngIf="!isLoading && !hasError" class="card">
    <!-- Avatar Section -->
    <div class="profile-avatar-section">
      <div class="avatar-container">
        <div class="avatar-circle" *ngIf="profile.pictureUrl">
          <img [src]="getProfileImageUrl()" [alt]="profile.firstName" class="avatar-image" />
        </div>
        <div class="avatar-circle avatar-initials" *ngIf="!profile.pictureUrl">
          <span>{{ getUserInitials() }}</span>
        </div>
      </div>
      <div class="profile-name-section">
        <h2>{{ profile.firstName }} {{ profile.lastName }}</h2>
        <p class="role-badge">{{ profile.roleLabel }}</p>
      </div>
    </div>

    <!-- Profile Fields -->
    <div class="profile-fields">
      <!-- Usuario -->
      <div class="field-group">
        <label for="username">
          <i class="fas fa-user"></i> Usuario
        </label>
        <input
          type="text"
          id="username"
          class="form-input text-uppercase"
          [(ngModel)]="profile.username"
          readonly
        />
      </div>

      <!-- Nombre -->
      <div class="field-group">
        <label for="firstName">
          <i class="fas fa-id-card"></i> Nombre
        </label>
        <input
          type="text"
          id="firstName"
          class="form-input text-uppercase"
          [(ngModel)]="profile.firstName"
          readonly
        />
      </div>

      <!-- Apellido -->
      <div class="field-group">
        <label for="lastName">
          <i class="fas fa-id-card"></i> Apellido
        </label>
        <input
          type="text"
          id="lastName"
          class="form-input text-uppercase"
          [(ngModel)]="profile.lastName"
          readonly
        />
      </div>

      <!-- Email -->
      <div class="field-group">
        <label for="email">
          <i class="fas fa-envelope"></i> Correo electrónico
        </label>
        <input
          type="email"
          id="email"
          class="form-input"
          [(ngModel)]="profile.email"
          readonly
        />
      </div>

      <!-- Rol -->
      <div class="field-group">
        <label for="role">
          <i class="fas fa-briefcase"></i> Rol
        </label>
        <input
          type="text"
          id="role"
          class="form-input text-uppercase"
          [(ngModel)]="profile.roleLabel"
          readonly
        />
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="profile-actions">
      <button class="btn btn-primary btn-large" (click)="changePassword()">
        <i class="fas fa-key"></i>
        Cambiar contraseña
      </button>
      <button class="btn btn-outline btn-large" (click)="openEmergencyData()" *ngIf="showEmergencyDataButton()">
        <i class="fas fa-stethoscope"></i>
        Información de Emergencia
      </button>
    </div>
  </div>
</div>
