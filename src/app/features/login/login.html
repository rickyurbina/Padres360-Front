<!-- login.component.html -->
<div class="center-screen">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" 
        class="login-card">
    
    <h2 class="text-center font-bold text-2xl mb-4">Iniciar Sesión</h2>

    <!-- Usuario -->
    <div class="form-group">
      <label>
        <span>Nombre de Usuario</span>
        <input
          type="text"
          formControlName="identifier"
          placeholder="Ingresa tu usuario"
          required
          [class.invalid]="shouldShowError('identifier')"  
        />
      </label>
      <div class="error-message" *ngIf="shouldShowError('identifier')">  
        <span *ngIf="identifier?.errors?.['required']">El usuario es requerido</span>
      </div>
    </div>

    <!-- Password -->
    <div class="form-group">
      <label>
        <span>Password</span>
        <input
          type="password"
          formControlName="password"
          placeholder="********"
          required
          [class.invalid]="shouldShowError('password')"  
        />
      </label>
      <div class="error-message" *ngIf="shouldShowError('password')">  
        <span *ngIf="password?.errors?.['required']">La contraseña es requerida</span>
        <span *ngIf="password?.errors?.['minlength']">
          La contraseña debe tener al menos 6 caracteres
        </span>
      </div>
    </div>

    <!-- Mensajes de error / éxito -->
    <div *ngIf="error()" class="mb-4 p-3 rounded-md bg-[var(--danger)]/10 border border-[var(--danger)] text-[var(--danger)] text-sm">
      {{ error() }}
    </div>
    <div *ngIf="successMessage()" class="mb-4 p-3 rounded-md bg-[var(--ok)]/10 border border-[var(--ok)] text-[var(--ok)] text-sm">
      {{ successMessage() }}
    </div>

    <!-- Botones -->
    <div class="button-group">
      <button
        type="submit"
        [disabled]="isLoading()"
        class="btn btn-primary"
        [class.opacity-70]="isLoading()"
        [class.cursor-not-allowed]="isLoading()"
      >
        {{ isLoading() ? 'Cargando...' : 'Login' }}
      </button>

      <!-- Botón para ir a Validación -->
      <button
        type="button"
        (click)="goToValidation()"
        class="btn btn-secondary"
      >
        Ir a Validación
      </button>
    </div>
  </form>
</div>
